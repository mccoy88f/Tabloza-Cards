services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tabloza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tabloza}
      POSTGRES_DB: ${POSTGRES_DB:-tabloza}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tabloza}:${POSTGRES_PASSWORD:-tabloza}@db:5432/${POSTGRES_DB:-tabloza}
      JWT_SECRET: ${JWT_SECRET:?Imposta JWT_SECRET nel file .env (almeno 32 caratteri)}
      TOKEN_TTL_HOURS: ${TOKEN_TTL_HOURS:-168}
      RUST_LOG: ${RUST_LOG:-backend=info,tower_http=warn}
    # Nessuna porta pubblicata sull'host: in produzione (es. Coolify) il traffico arriva
    # dal reverse proxy. Per l'uso in locale vedi docker-compose.local.yml.
    expose:
      - "3000"

volumes:
  pgdata:
